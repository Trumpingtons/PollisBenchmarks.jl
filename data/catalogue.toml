# The benchmarks of PollisBenchmarks.jl: one entry each, which Pollis copies into the table `catalogue` of its
# built-in database PollisBenchmarks. The questions of a benchmark Built In are in the artifact `benchmarks`:
# `<id>.parquet`, the questions of the benchmark, with `<id>-examples.parquet`, the solved examples a prompt can show,
# and `<id>-documents.parquet`, the documents a retrieval benchmark searches, when it has them; Pollis copies them into
# one table, named by its id, told apart by its column `split`. An id is a name SQL takes as it is: lower-case
# letters, digits and underscores. Those of a benchmark to Download are not in the artifact,
# by their licence or their size: they are fetched from their source, at its revision, by a page that runs them.
#
# `source` and `revision` name each source the questions come from and its revision, in the same order. `layout` is
# "questions" (id, stratum, question, choices, answer, worked, and the columns of `columns`) or "retrieval" (id,
# title, text, relevant). `columns` describes the columns of a benchmark of its own, or what a column means for it.
# `questions` is left out where the number of questions is not confirmed.
# `size_mb`, for a benchmark to Download, is the size of the files of its source that hold its questions, as fetched;
# that of a benchmark Built In is the size of its files in the artifact, which Pollis measures.

