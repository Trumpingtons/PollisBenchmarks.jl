# The benchmarks of PollisBenchmarks.jl: one entry each, which Pollis copies into the table `catalogue` of its
# built-in database PollisBenchmarks. The questions of each are in the artifact `benchmarks`: `<id>.parquet`, the
# questions of the benchmark, with `<id>-examples.parquet`, the solved examples a prompt can show, and
# `<id>-documents.parquet`, the documents a retrieval benchmark searches, when it has them; Pollis copies them into
# one table, `table`, told apart by its column `split`.
#
# `source` and `revision` name each source the questions come from and its revision, in the same order. `layout` is
# "questions" (id, stratum, question, choices, answer, worked, and the columns of `columns`) or "retrieval" (id,
# title, text, relevant). `columns` describes the columns of a benchmark of its own, or what a column means for it.

[[benchmarks]]
id = "mmlu-pro"
table = "mmlu_pro"
benchmark = "MMLU-Pro"
component = "Closed Book Answering"
domain = "14 subjects, from law and economics to physics"
layout = "questions"
questions = 12032
released = "2024-06"
licence = "MIT"
licence_url = "https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro"
source = ["https://huggingface.co/datasets/TIGER-Lab/MMLU-Pro"]
revision = ["b189ec765aa7ed75c8acfea42df31fdae71f97be"]
grading = "The letter of the option chosen, among up to ten"
page = "Model Benchmarks"
reference = "WMZNC...2024a"

